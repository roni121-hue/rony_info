    <link rel="preconnect" href="https://fonts.googleapis.com">

    <!-- Added crossorigin="anonymous" to the stylesheet link to fix the 'cssRules' access error -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" crossorigin="anonymous">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #020617;
        margin: 0;
        overflow-x: hidden;
      }
      .glass {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      .neon-border {
        box-shadow: 0 0 15px rgba(59, 130, 246, 0.5);
      }
      .purple-glow {
        box-shadow: 0 0 20px rgba(168, 85, 247, 0.4);
      }
      @keyframes float {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
        100% { transform: translateY(0px); }
      }
      .float-anim {
        animation: float 4s ease-in-out infinite;
      }
    </style>
